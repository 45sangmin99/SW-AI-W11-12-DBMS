<svg xmlns="http://www.w3.org/2000/svg" width="920" height="278" viewBox="0 0 920 278" role="img" aria-labelledby="title desc">
  <title id="title">2PL vs Snapshot</title>
  <desc id="desc">2PL에서는 쓰기가 읽기가 끝나기를 기다린다. 스냅샷에서는 이전 버전을 읽는 동안 새 버전의 쓰기가 진행된다.</desc>
  <rect width="920" height="278" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#1a1a1a">
    <text x="32" y="31" font-size="20" font-weight="700">2PL</text>
    <text x="32" y="157" font-size="20" font-weight="700">Snapshot</text>
    <g font-size="15">
      <text x="92" y="72" text-anchor="end">Read</text>
      <text x="92" y="111" text-anchor="end">Write</text>
      <text x="92" y="198" text-anchor="end">Read</text>
      <text x="92" y="237" text-anchor="end">Write</text>
    </g>
  </g>
  <g stroke="#1a1a1a" stroke-width="1.5" fill="none">
    <line x1="113" y1="63" x2="885" y2="63" stroke="#e6e6e6"/>
    <line x1="113" y1="102" x2="885" y2="102" stroke="#e6e6e6"/>
    <line x1="113" y1="189" x2="885" y2="189" stroke="#e6e6e6"/>
    <line x1="113" y1="228" x2="885" y2="228" stroke="#e6e6e6"/>
    <line x1="32" y1="133" x2="888" y2="133" stroke="#e4e4e4"/>
  </g>
  <!-- 2PL: reader holds shared lock, writer waits, then proceeds -->
  <rect x="134" y="48" width="380" height="30" rx="3" fill="#1b1b1b"/>
  <rect x="261" y="87" width="253" height="30" rx="3" fill="#fff" stroke="#777" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="514" y="87" width="230" height="30" rx="3" fill="#6c6c6c"/>
  <text x="388" y="107.5" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333" text-anchor="middle">WAIT</text>
  <!-- Snapshot: reader v1 and writer v2 overlap -->
  <rect x="134" y="174" width="610" height="30" rx="3" fill="#1b1b1b"/>
  <rect x="261" y="213" width="253" height="30" rx="3" fill="#6c6c6c"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#fff" text-anchor="middle">
    <text x="435" y="194.5">v1</text>
    <text x="388" y="233.5">v2</text>
  </g>
</svg>
